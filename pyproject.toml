[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "possession-mtah2027"
version = "1.0.0"
description = "Frame-level ball possession from automatic tracking data, More Than A Hack 2027"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Alexandru Popescu" }]
requires-python = ">=3.10,<3.11"
dependencies = [
    "joblib",
    "numba",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
]

[project.optional-dependencies]
test = ["pytest"]
train = ["torch==2.5.1"]

[project.scripts]
possession-run = "possession.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
